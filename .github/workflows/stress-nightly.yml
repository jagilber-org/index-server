name: Nightly Stress Suite

on:
  # Manual-only stress suite to conserve action minutes.
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stress-tests:
    name: Stress / Adversarial Tests
    runs-on: ubuntu-latest
    env:
      INDEX_SERVER_STRESS_DIAG: '1'
      SKIP_PRETEST_BUILD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6 # pii-allowlist: pinned action SHA
      - name: Use Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6 # pii-allowlist: pinned action SHA
        with:
          node-version: 22
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Run stress focus (quick signal)
        run: npm run test:stress:focus || echo 'Focus suite had failures (expected possible)'
      - name: Run full stress suite
        run: npm run test:stress || echo 'Full stress suite had failures (expected possible)'
      - name: Collect diagnostics pack
        if: always()
        run: |
          echo 'Collecting diagnostics pack (stress context)'
          node scripts/diagnostics/diagnostics-pack.mjs || echo 'diagnostics pack script failed'
      - name: Archive stress artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7 # pii-allowlist: pinned action SHA
        with:
          name: stress-logs
          path: |
            stderr.log
            stdout.log
            diag-*.log
            diagnostics/
            logs/
          retention-days: 5
      - name: Open issue on new failure cluster
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9 # pii-allowlist: pinned action SHA
        with:
          script: |
            const title = `⚠️ Nightly Stress Failures - ${new Date().toISOString().split('T')[0]}`;
            const body = `Nightly stress suite detected failures. Review artifacts and consider triage.\n\nEnvironment Flag: INDEX_SERVER_STRESS_DIAG=1`;
            const existing = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'stress-failure' });
            if(!existing.data.some(i=> i.title.startsWith('⚠️ Nightly Stress Failures'))){
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['stress-failure','automated-issue'] });
            }
