name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Governance guards (#582). `guard:all` ran in no workflow whatsoever, and had
  # been exit-1 on main for months without anyone seeing it.
  #
  # Owner-gated to match build-test below: on the public mirror this is the only
  # lane, so the guards belong here. On the private jagilber-dev remote this job
  # skips, and ci-self-hosted.yml's `guards` job -- which is deliberately NOT
  # owner-gated -- carries the same `npm run guard:all` on the maintainer's own
  # hardware. Both invoke the single composition in package.json rather than
  # restating the list, so the two lanes cannot disagree.
  guards:
    if: ${{ github.repository_owner == 'jagilber-org' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6 # pii-allowlist: pinned action SHA
        with:
          # guard:changelog resolves the last v* tag and the commits since it.
          # A shallow checkout has neither, and the gate treats a missing tag as
          # a failure rather than a clean pass (#575) -- so it would go red for
          # the wrong reason.
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6 # pii-allowlist: pinned action SHA
        with:
          node-version: 22
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Governance guards (guard:all)
        run: npm run guard:all

  build-test:
    # Default CI/test spend belongs on the public mirror. The private dev repo
    # keeps leak/security gates in precommit.yml and can still run this manually.
    if: ${{ github.repository_owner == 'jagilber-org' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6 # pii-allowlist: pinned action SHA
      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6 # pii-allowlist: pinned action SHA
        with:
          node-version: 22
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Lint
        run: |
          if [ -f package.json ]; then npm run lint --if-present; fi
      - name: Build (explicit, before tests)
        run: |
          npm run build --if-present

      - name: Validate npm package files (#247)
        # Drift detector: catches the failure class from PR #240 — a shipped
        # script dynamically invokes a sibling that is NOT in
        # `package.json#files`, so npm-installed consumers get ENOENT at
        # runtime. See scripts/governance/validate-npm-files.mjs.
        run: npm run validate:npm-files
      - name: Ensure instructions directory
        run: |
          mkdir -p instructions
          if [ ! "$(ls instructions/*.json 2>/dev/null)" ]; then
            echo '{"id":"ci-seed","title":"CI Seed","body":"Seed instruction for CI.","priority":50,"audience":"all","requirement":"optional","categories":["ci"],"contentType":"instruction","version":"1.0.0","status":"approved"}' > instructions/ci-seed.json
          fi
      - name: Verify dist artifacts
        run: |
          echo "Listing dist/server contents (if any)";
          if [ -d dist/server ]; then ls -al dist/server; else echo "dist/server missing"; fi
          if [ ! -f dist/server/index-server.js ]; then echo "ERROR: dist/server/index-server.js not found; failing early"; exit 1; fi
      - name: Test
        run: |
          # Fast suite on PRs to conserve Actions minutes; full coverage runs
          # on main pushes (event_name != 'pull_request'). The slow concurrent /
          # stress / multi-instance suites have their own dedicated workflows
          # (multi-agent-concurrency.yml, stress-nightly.yml, multi-instance-validation.yml).
          mkdir -p test-results
          set -o pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "PR run: using test:fast (no coverage) to conserve minutes"
            npm test --if-present 2>&1 | tee test-results/test-output.log
          else
            echo "Push/dispatch run: full coverage suite"
            npm run coverage:ci --if-present 2>&1 | tee test-results/test-output.log
          fi
      - name: Validate test artifacts (no leakage, no oversized files)
        if: always()
        run: node scripts/governance/validate-no-test-artifacts.mjs
      - name: Crawl test logs (hygiene gate — fail on repeat-spam / WARN+stack)
        if: always()
        # Per-signature repeat threshold and stack-warn budget both default to 25.
        # Known operational categories (search input validation, embedding fallback,
        # invariant-repair fixtures, etc.) are signature-allowlisted in
        # .crawl-logs-allowlist with one-line rationales per OB-6.
        run: |
          node scripts/diagnostics/crawl-logs.mjs \
            --dir logs \
            --file test-results/test-output.log \
            --allowlist .crawl-logs-allowlist \
            --summary test-results/log-hygiene.json \
            --strict
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7 # pii-allowlist: pinned action SHA
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/cobertura-coverage.xml,./coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false
          directory: ./coverage
      - name: Upload coverage (directory)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7 # pii-allowlist: pinned action SHA
        with:
          name: coverage
          path: coverage
          if-no-files-found: warn
      - name: Upload coverage lcov
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7 # pii-allowlist: pinned action SHA
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1 # pii-allowlist: pinned action SHA
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./test-results/junit.xml
          fail_ci_if_error: false
      - name: Upload test results JSON
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7 # pii-allowlist: pinned action SHA
        with:
          name: test-results
          path: test-results
          if-no-files-found: warn
      - name: Upload server and trace logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7 # pii-allowlist: pinned action SHA
        with:
          name: server-logs
          path: |
            logs/
            *.log
          retention-days: 7
          if-no-files-found: warn
